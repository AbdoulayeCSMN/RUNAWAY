<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%"
viewBox="0 0 1000 6000"
version="1.1"
xmlns="http://www.w3.org/2000/svg">

    <!-- LONG CITY ROAD (TOP DOWN GTA STYLE) -->

    <!-- BACKGROUND ROAD -->
    <rect x="320" y="0" width="360" height="6000"
          style="fill:rgb(70,74,82);"/>

    <!-- ROAD VARIATION (ASPHALT TEXTURE FEEL) -->
    <rect x="350" y="0" width="300" height="6000"
          style="fill:rgb(85,90,100);"/>

    <!-- SIDE WALKWAYS -->
    <rect x="280" y="0" width="40" height="6000"
          style="fill:rgb(55,58,65);"/>

    <rect x="680" y="0" width="40" height="6000"
          style="fill:rgb(55,58,65);"/>

    <!-- CURB LINES -->
    <rect x="320" y="0" width="8" height="6000"
          style="fill:rgb(130,130,130);"/>

    <rect x="672" y="0" width="8" height="6000"
          style="fill:rgb(130,130,130);"/>

    <!-- CENTER DIVIDER -->
    <rect x="490" y="0" width="20" height="6000"
          style="fill:rgb(110,110,115);"/>

    <!-- YELLOW DASHED LINE -->
    <path d="M500,0L500,6000"
          style="
          fill:none;
          stroke:rgb(255,210,80);
          stroke-width:3px;
          stroke-dasharray:28,16;
          stroke-linecap:round;"/>

    <!-- LANE MARKINGS -->
    <g stroke="white" stroke-opacity="0.22" stroke-width="2">

        <path d="M420,0L420,6000"/>
        <path d="M580,0L580,6000"/>

    </g>

    <!-- SIDE SHADOWS -->
    <rect x="350" y="0" width="10" height="6000"
          style="fill:black;fill-opacity:0.08;"/>

    <rect x="640" y="0" width="10" height="6000"
          style="fill:black;fill-opacity:0.08;"/>

    <!-- CITY DETAILS (REPEATED BLOCKS) -->
    <g fill="rgb(95,100,110)">

        <!-- LEFT SIDE BUILDINGS -->
        <rect x="80" y="200" width="180" height="260"/>
        <rect x="80" y="600" width="160" height="220"/>
        <rect x="90" y="1000" width="190" height="280"/>
        <rect x="70" y="1500" width="170" height="240"/>
        <rect x="100" y="2000" width="150" height="260"/>
        <rect x="85" y="2600" width="180" height="300"/>
        <rect x="90" y="3200" width="160" height="240"/>
        <rect x="80" y="3800" width="190" height="280"/>
        <rect x="70" y="4400" width="170" height="240"/>
        <rect x="95" y="5000" width="180" height="260"/>

        <!-- RIGHT SIDE BUILDINGS -->
        <rect x="760" y="200" width="180" height="260"/>
        <rect x="780" y="600" width="160" height="220"/>
        <rect x="770" y="1000" width="190" height="280"/>
        <rect x="790" y="1500" width="170" height="240"/>
        <rect x="760" y="2000" width="150" height="260"/>
        <rect x="775" y="2600" width="180" height="300"/>
        <rect x="780" y="3200" width="160" height="240"/>
        <rect x="770" y="3800" width="190" height="280"/>
        <rect x="790" y="4400" width="170" height="240"/>
        <rect x="760" y="5000" width="180" height="260"/>

    </g>

    <!-- STREET INTERSECTIONS -->
    <g opacity="0.9">

        <rect x="320" y="900" width="360" height="40"
              style="fill:rgb(60,60,68);"/>

        <rect x="320" y="1800" width="360" height="40"
              style="fill:rgb(60,60,68);"/>

        <rect x="320" y="2800" width="360" height="40"
              style="fill:rgb(60,60,68);"/>

        <rect x="320" y="3800" width="360" height="40"
              style="fill:rgb(60,60,68);"/>

        <rect x="320" y="4800" width="360" height="40"
              style="fill:rgb(60,60,68);"/>

    </g>

    <!-- STREET LIGHTS -->
    <g stroke="rgb(140,140,140)" stroke-width="3">

        <path d="M300,300L300,360"/>
        <circle cx="300" cy="300" r="6" fill="yellow"/>

        <path d="M300,1100L300,1160"/>
        <circle cx="300" cy="1100" r="6" fill="yellow"/>

        <path d="M300,1900L300,1960"/>
        <circle cx="300" cy="1900" r="6" fill="yellow"/>

        <path d="M300,2700L300,2760"/>
        <circle cx="300" cy="2700" r="6" fill="yellow"/>

        <path d="M300,3500L300,3560"/>
        <circle cx="300" cy="3500" r="6" fill="yellow"/>

        <path d="M300,4300L300,4360"/>
        <circle cx="300" cy="4300" r="6" fill="yellow"/>

        <path d="M300,5100L300,5160"/>
        <circle cx="300" cy="5100" r="6" fill="yellow"/>

        <!-- RIGHT SIDE -->
        <path d="M700,300L700,360"/>
        <circle cx="700" cy="300" r="6" fill="yellow"/>

        <path d="M700,1100L700,1160"/>
        <circle cx="700" cy="1100" r="6" fill="yellow"/>

        <path d="M700,1900L700,1960"/>
        <circle cx="700" cy="1900" r="6" fill="yellow"/>

        <path d="M700,2700L700,2760"/>
        <circle cx="700" cy="2700" r="6" fill="yellow"/>

        <path d="M700,3500L700,3560"/>
        <circle cx="700" cy="3500" r="6" fill="yellow"/>

        <path d="M700,4300L700,4360"/>
        <circle cx="700" cy="4300" r="6" fill="yellow"/>

        <path d="M700,5100L700,5160"/>
        <circle cx="700" cy="5100" r="6" fill="yellow"/>

    </g>

</svg>